name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Deploy to temporary test environment and scan with OWASP ZAP
        run: |
          set -euo pipefail
          jwt_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          admin_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          zap_dir="$RUNNER_TEMP/zap"
          mkdir -p "$zap_dir"
          chmod 777 "$zap_dir"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          export JWT_SECRET_KEY="$jwt_secret"
          export ADMIN_PASSWORD="$admin_password"

          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat app.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat app.log
            echo "La API no estuvo disponible para el escaneo de seguridad."
            exit 1
          fi

          docker run --rm --network host \
            -v "$zap_dir:/zap/wrk/:rw" \
            zaproxy/zap-stable:latest \
            zap-baseline.py -t http://127.0.0.1:8000/docs -r zap-report.html -J zap-report.json -a -I

          test -s "$zap_dir/zap-report.html"
          test -s "$zap_dir/zap-report.json"

      - name: Upload OWASP ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-report
          path: |
            ${{ runner.temp }}/zap/zap-report.html
            ${{ runner.temp }}/zap/zap-report.json
          if-no-files-found: warn
