name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonar:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Deploy to temporary test environment and scan with OWASP ZAP
        run: |
          set -euo pipefail
          python -c "import secrets; print(f'JWT_SECRET_KEY={secrets.token_urlsafe(48)}'); print(f'ADMIN_PASSWORD={secrets.token_urlsafe(24)}')" >> "$GITHUB_ENV"
          source "$GITHUB_ENV"

          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat app.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat app.log
            echo "La API no estuvo disponible para el escaneo de seguridad."
            exit 1
          fi

          docker run --rm --network host \
            -v "$PWD:/zap/wrk/:rw" \
            zaproxy/zap-stable:latest \
            zap-baseline.py -t http://127.0.0.1:8000 -r zap-report.html -J zap-report.json -a -I

      - name: Upload OWASP ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-report
          path: |
            zap-report.html
            zap-report.json
          if-no-files-found: warn
